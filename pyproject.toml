[project]
name = "jev-guardrail-evaluation"
version = "0.1.0"
description = "A hands-on evaluation pipeline for low-latency Jev guardrails"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "datasets>=3.3.2",
    "typesafe-sdk>=0.1.0",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29.5",
    "jupyterlab>=4.3.6",
    "pytest>=8.3.5",
    "ruff>=0.11.0",
]

[project.scripts]
jev-eval = "jev_eval.cli:main"

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jev_eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"